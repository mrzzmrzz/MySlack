name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          go tool mygo vet .
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Build the disk image
        run: go tool mygo build -platform darwin/arm64 -skip-notarize
      - uses: actions/upload-artifact@v5
        with:
          name: MySlack-dmg
          path: build/darwin-arm64/*.dmg
          if-no-files-found: error
